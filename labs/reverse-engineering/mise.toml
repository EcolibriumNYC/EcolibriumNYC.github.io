# Tools for the Reverse Engineering page. They're only installed when you run
# `mise install` in this folder, so the rest of the site doesn't need them.

[tools]
# Ghidra isn't in a package registry, so we pin its release download and the
# SHA-256 the Ghidra team publishes with it.
java = "temurin-21"   # the Java version Ghidra 12 needs

[tools."http:ghidra"]
version = "12.1.4"
url = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
checksum = "sha256:ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"
strip_components = 1   # the zip wraps everything in one folder
bin_path = "."         # ghidraRun sits at the top of that folder

[tasks.ghidra]
description = "Open Ghidra (the version pinned above)"
run = "ghidraRun"

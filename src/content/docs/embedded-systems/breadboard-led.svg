<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Beginner embedded project: button and LED on a breadboard</title>
  <desc id="desc">A microcontroller board sits on a breadboard. Inside its chip are four blocks: CPU, flash storage, RAM memory, and GPIO. One GPIO pin connects through a resistor to an LED; another GPIO pin connects to a push button. Both return to a shared ground rail. A USB cable powers the board and uploads the firmware.</desc>

  <defs>
    <pattern id="holes" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="4" height="4" rx="1" fill="#d6ccb9"/>
    </pattern>
  </defs>

  <!-- Card background so the diagram reads in light and dark themes -->
  <rect width="800" height="440" rx="16" fill="#ffffff"/>

  <!-- Breadboard -->
  <rect x="30" y="50" width="740" height="330" rx="12" fill="#f5f0e6" stroke="#c9bfae" stroke-width="2"/>
  <rect x="40" y="60" width="720" height="290" fill="url(#holes)"/>
  <text x="44" y="40" font-size="15" fill="#5b5346">Breadboard</text>

  <!-- Ground rail -->
  <line x1="50" y1="362" x2="750" y2="362" stroke="#2f6fd6" stroke-width="4"/>
  <text x="756" y="400" font-size="14" fill="#2f6fd6" text-anchor="end">GND rail (−)</text>

  <!-- USB -->
  <rect x="8" y="182" width="64" height="34" rx="5" fill="#9aa1a9"/>
  <text x="40" y="236" font-size="12" fill="#3d434a" text-anchor="middle">USB</text>
  <text x="40" y="252" font-size="11" fill="#3d434a" text-anchor="middle">power +</text>
  <text x="40" y="266" font-size="11" fill="#3d434a" text-anchor="middle">upload</text>

  <!-- Microcontroller board -->
  <rect x="70" y="100" width="270" height="220" rx="10" fill="#1f6f5c"/>
  <text x="205" y="124" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Microcontroller board</text>

  <!-- Chip with the four resources -->
  <rect x="86" y="138" width="184" height="164" rx="6" fill="#23272e"/>
  <rect x="94" y="148" width="80" height="68" rx="5" fill="#f2b84b"/>
  <text x="134" y="178" font-size="15" fill="#23272e" text-anchor="middle" font-weight="700">CPU</text>
  <text x="134" y="197" font-size="11" fill="#23272e" text-anchor="middle">runs the loop</text>

  <rect x="182" y="148" width="80" height="68" rx="5" fill="#8fc1ff"/>
  <text x="222" y="174" font-size="14" fill="#23272e" text-anchor="middle" font-weight="700">Storage</text>
  <text x="222" y="191" font-size="11" fill="#23272e" text-anchor="middle">flash:</text>
  <text x="222" y="205" font-size="11" fill="#23272e" text-anchor="middle">firmware</text>

  <rect x="94" y="224" width="80" height="68" rx="5" fill="#b7e4a8"/>
  <text x="134" y="250" font-size="14" fill="#23272e" text-anchor="middle" font-weight="700">Memory</text>
  <text x="134" y="267" font-size="11" fill="#23272e" text-anchor="middle">RAM:</text>
  <text x="134" y="281" font-size="11" fill="#23272e" text-anchor="middle">LED on/off</text>

  <rect x="182" y="224" width="80" height="68" rx="5" fill="#f4a3b4"/>
  <text x="222" y="250" font-size="14" fill="#23272e" text-anchor="middle" font-weight="700">IO</text>
  <text x="222" y="267" font-size="11" fill="#23272e" text-anchor="middle">GPIO pins</text>
  <text x="222" y="281" font-size="11" fill="#23272e" text-anchor="middle">in + out</text>

  <!-- Board pins -->
  <circle cx="340" cy="160" r="6" fill="#e8c766" stroke="#7a6420"/>
  <circle cx="340" cy="240" r="6" fill="#e8c766" stroke="#7a6420"/>
  <circle cx="340" cy="300" r="6" fill="#e8c766" stroke="#7a6420"/>
  <text x="330" y="151" font-size="11" fill="#ffffff" text-anchor="end">GPIO out</text>
  <text x="330" y="231" font-size="11" fill="#ffffff" text-anchor="end">GPIO in</text>
  <text x="330" y="315" font-size="11" fill="#ffffff" text-anchor="end">GND</text>

  <!-- Output: pin -> resistor -> LED -> GND -->
  <polyline points="346,160 430,160" fill="none" stroke="#e0533d" stroke-width="4" stroke-linecap="round"/>
  <rect x="430" y="150" width="70" height="20" rx="8" fill="#e7d3a7" stroke="#8a7445"/>
  <rect x="446" y="150" width="6" height="20" fill="#c0392b"/>
  <rect x="460" y="150" width="6" height="20" fill="#c0392b"/>
  <rect x="474" y="150" width="6" height="20" fill="#5a3a1a"/>
  <text x="465" y="140" font-size="12" fill="#3d434a" text-anchor="middle">Resistor (limits current)</text>
  <polyline points="500,160 590,160" fill="none" stroke="#e0533d" stroke-width="4" stroke-linecap="round"/>
  <!-- LED -->
  <circle cx="612" cy="160" r="22" fill="#ff4d4d" opacity="0.25"/>
  <path d="M598 170 v-14 a14 14 0 0 1 28 0 v14 z" fill="#ff4d4d" stroke="#a52a2a" stroke-width="2"/>
  <rect x="594" y="170" width="36" height="5" fill="#a52a2a"/>
  <text x="648" y="152" font-size="13" fill="#3d434a" font-weight="600">LED</text>
  <text x="648" y="168" font-size="11" fill="#3d434a">output</text>
  <polyline points="620,175 620,362" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- Input: pin -> button -> GND -->
  <polyline points="346,240 470,240" fill="none" stroke="#f2b84b" stroke-width="4" stroke-linecap="round"/>
  <rect x="470" y="222" width="40" height="40" rx="4" fill="#3b3f46"/>
  <circle cx="490" cy="242" r="11" fill="#c94f4f"/>
  <text x="490" y="284" font-size="13" fill="#3d434a" text-anchor="middle" font-weight="600">Push button</text>
  <text x="490" y="300" font-size="11" fill="#3d434a" text-anchor="middle">input</text>
  <polyline points="510,240 540,240 540,362" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- Board ground -->
  <polyline points="346,300 380,300 380,362" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- Junction dots on rail -->
  <circle cx="380" cy="362" r="5" fill="#333"/>
  <circle cx="540" cy="362" r="5" fill="#333"/>
  <circle cx="620" cy="362" r="5" fill="#333"/>

  <text x="400" y="425" font-size="13" fill="#5b5346" text-anchor="middle">Press the button → the CPU reads the input pin, updates the LED state in memory, and sets the output pin.</text>
</svg>

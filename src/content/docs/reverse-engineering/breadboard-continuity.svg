<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Checking breadboard connections with a multimeter's continuity mode</title>
  <desc id="desc">A section of breadboard with its hidden metal strips drawn in. Each column of five holes on one side of the center gap shares a strip. Test 1: both probes in the same group of five holes, and the meter beeps because they are connected. Test 2: one probe on each side of the center gap, and the meter stays silent because the halves are not connected.</desc>

  <!-- Card background so the diagram reads in light and dark themes -->
  <rect width="800" height="380" rx="16" fill="#ffffff"/>

  <!-- Breadboard -->
  <rect x="40" y="50" width="500" height="290" rx="12" fill="#f5f0e6" stroke="#c9bfae" stroke-width="2"/>
  <text x="44" y="36" font-size="15" fill="#5b5346">Breadboard, with its hidden metal strips drawn in</text>

  <!-- Hidden metal strips: one per column, per half -->
  <g fill="#f2c48a" opacity="0.8">
    <rect x="72" y="78" width="16" height="112" rx="4"/><rect x="72" y="210" width="16" height="112" rx="4"/>
    <rect x="108" y="78" width="16" height="112" rx="4"/><rect x="108" y="210" width="16" height="112" rx="4"/>
    <rect x="144" y="78" width="16" height="112" rx="4"/><rect x="144" y="210" width="16" height="112" rx="4"/>
    <rect x="180" y="78" width="16" height="112" rx="4"/><rect x="180" y="210" width="16" height="112" rx="4"/>
    <rect x="216" y="78" width="16" height="112" rx="4"/><rect x="216" y="210" width="16" height="112" rx="4"/>
    <rect x="252" y="78" width="16" height="112" rx="4"/><rect x="252" y="210" width="16" height="112" rx="4"/>
    <rect x="288" y="78" width="16" height="112" rx="4"/><rect x="288" y="210" width="16" height="112" rx="4"/>
    <rect x="324" y="78" width="16" height="112" rx="4"/><rect x="324" y="210" width="16" height="112" rx="4"/>
    <rect x="360" y="78" width="16" height="112" rx="4"/><rect x="360" y="210" width="16" height="112" rx="4"/>
    <rect x="396" y="78" width="16" height="112" rx="4"/><rect x="396" y="210" width="16" height="112" rx="4"/>
    <rect x="432" y="78" width="16" height="112" rx="4"/><rect x="432" y="210" width="16" height="112" rx="4"/>
    <rect x="468" y="78" width="16" height="112" rx="4"/><rect x="468" y="210" width="16" height="112" rx="4"/>
  </g>

  <!-- Holes: 12 columns x 5 rows, in each half -->
  <defs>
    <pattern id="holes" x="77" y="87" width="36" height="22" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="6" rx="1" fill="#6b6152"/>
    </pattern>
  </defs>
  <rect x="77" y="87" width="408" height="100" fill="url(#holes)"/>
  <rect x="77" y="219" width="408" height="100" fill="url(#holes)"/>

  <!-- Center gap -->
  <rect x="56" y="196" width="468" height="10" fill="#e1d8c6"/>
  <line x1="524" y1="201" x2="548" y2="201" stroke="#a89e8b" stroke-width="1.5"/>
  <text x="552" y="205" font-size="12" fill="#5b5346">center gap</text>

  <!-- Test 1: same strip (column 3, top half) -->
  <circle cx="152" cy="90" r="8" fill="#d63a2f" stroke="#7a1d17" stroke-width="2"/>
  <circle cx="152" cy="178" r="8" fill="#23272e" stroke="#000000" stroke-width="2"/>
  <circle cx="122" cy="134" r="13" fill="#1f7a4d"/>
  <text x="122" y="139" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>

  <!-- Test 2: across the gap (column 9) -->
  <circle cx="368" cy="134" r="8" fill="#d63a2f" stroke="#7a1d17" stroke-width="2"/>
  <circle cx="368" cy="266" r="8" fill="#23272e" stroke="#000000" stroke-width="2"/>
  <circle cx="338" cy="200" r="13" fill="#c0392b"/>
  <text x="338" y="205" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>

  <!-- Results -->
  <circle cx="580" cy="96" r="13" fill="#1f7a4d"/>
  <text x="580" y="101" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="602" y="92" font-size="15" fill="#23272e" font-weight="700">Same strip: beep</text>
  <text x="602" y="112" font-size="12" fill="#3d434a">The five holes in a group</text>
  <text x="602" y="128" font-size="12" fill="#3d434a">are connected inside.</text>

  <circle cx="580" cy="246" r="13" fill="#c0392b"/>
  <text x="580" y="251" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text x="602" y="242" font-size="15" fill="#23272e" font-weight="700">Across the gap: silence</text>
  <text x="602" y="262" font-size="12" fill="#3d434a">The two halves are</text>
  <text x="602" y="278" font-size="12" fill="#3d434a">not connected.</text>

  <!-- Legend -->
  <circle cx="584" cy="312" r="7" fill="#d63a2f" stroke="#7a1d17" stroke-width="2"/>
  <text x="600" y="317" font-size="12" fill="#3d434a">red probe</text>
  <circle cx="584" cy="334" r="7" fill="#23272e" stroke="#000000" stroke-width="2"/>
  <text x="600" y="339" font-size="12" fill="#3d434a">black probe</text>
  <rect x="577" y="349" width="14" height="14" rx="3" fill="#f2c48a"/>
  <text x="600" y="361" font-size="12" fill="#3d434a">hidden metal strip</text>
</svg>

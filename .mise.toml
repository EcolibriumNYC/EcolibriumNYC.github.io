[tools]
node = "24.21.0"

[tasks.install]
description = "Install npm dependencies (skipped if up to date)"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Start the dev server with hot reload; prints the local URL"
depends = ["install"]
run = "npm run dev"

[tasks.preview]
description = "Production build, then serve it locally; prints the local URL"
depends = ["install"]
run = ["npm run build", "npm run preview"]
